# Every job's first step is step-security/harden-runner in audit mode
# (#26): it records every outbound network call this runner makes without
# blocking any of it, visible afterward in each run's "Harden Runner"
# step summary (and, once this workflow has run enough for a pattern to
# aggregate, in the repo's Security > Supply chain view). audit, not
# block: this repo has never observed and allowlisted its own real CI
# egress (module proxy, sum.golang.org, ghcr.io, Docker Hub for the
# Dockerfile's base images, GitHub's own API/artifact endpoints, the Trivy
# vulnerability DB, ...), and shipping a guessed allowlist risks silently
# breaking every future CI run instead of catching a real compromise.
# Graduating to egress-policy: block with a real allowlist is the natural
# follow-up once a few runs' worth of audit data exists to build one from.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: binary
          args: --timeout=3m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/nfs-quota-agent-linux-amd64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/nfs-quota-agent-linux-arm64 ./cmd/nfs-quota-agent

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: bin/

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Check dependency licenses against the explicit allowlist
        run: go tool go-licenses check ./... --allowed_licenses="$(paste -sd, hack/allowed-licenses.txt)"

      - name: Verify THIRD_PARTY_LICENSES.md is up to date
        run: |
          go tool go-licenses report ./... --template hack/third-party-licenses.tmpl > /tmp/THIRD_PARTY_LICENSES.md
          diff -u THIRD_PARTY_LICENSES.md /tmp/THIRD_PARTY_LICENSES.md || \
            (echo "::error::THIRD_PARTY_LICENSES.md is stale — run 'make license' and commit the result" && exit 1)

  generate:
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Verify generated deepcopy code and CRD manifest are up to date
        # controller-gen's import formatting depends on the other files already
        # present in the target package directory, so — unlike the license-check
        # diff above — the committed files must be regenerated in place (backed
        # up first) rather than compared against output written to a scratch
        # directory; the latter produces spurious diffs unrelated to staleness.
        run: |
          cp internal/apis/quota/v1alpha1/zz_generated.deepcopy.go /tmp/zz_generated.deepcopy.go.orig
          cp charts/nfs-quota-agent/crds/quota.nfs.io_quotapolicies.yaml /tmp/quota.nfs.io_quotapolicies.yaml.orig
          make generate
          diff -u /tmp/zz_generated.deepcopy.go.orig internal/apis/quota/v1alpha1/zz_generated.deepcopy.go || \
            (echo "::error::internal/apis/quota/v1alpha1/zz_generated.deepcopy.go is stale — run 'make generate' and commit the result" && exit 1)
          diff -u /tmp/quota.nfs.io_quotapolicies.yaml.orig charts/nfs-quota-agent/crds/quota.nfs.io_quotapolicies.yaml || \
            (echo "::error::charts/nfs-quota-agent/crds/quota.nfs.io_quotapolicies.yaml is stale — run 'make generate' and commit the result" && exit 1)

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.2.4'

      - name: Lint Helm chart
        run: helm lint ./charts/nfs-quota-agent

      - name: Template Helm chart (smoke test)
        run: helm template ./charts/nfs-quota-agent --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true --set podDisruptionBudget.enabled=true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26'
          go-package: './...'
