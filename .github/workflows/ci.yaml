# Every job's first step is step-security/harden-runner (#26), now in
# block mode with a per-job allowed-endpoints list built from this
# workflow's own audit-mode run history rather than guessed. GitHub's own
# runner control-plane traffic (results-receiver, hosted-compute-*,
# productionresultssa*.blob.core.windows.net, stepsecurity.io itself) does
# not need to be listed -- harden-runner permits it regardless of
# allowed-endpoints. sum.golang.org is listed defensively in every Go job
# even though it did not appear in the observed audit runs: it is only
# contacted when go.sum lacks a hash for a newly-added dependency, which
# a normal CI run never exercises but a future dependency-bump PR will.
# The License Check job's go.yaml.in/golang.org/google.golang.org/gopkg.in/
# k8s.io/sigs.k8s.io entries come from go-licenses resolving each module's
# documented source -- that set tracks go.sum and may need updating when
# dependencies change; a block here shows up as a License Check failure
# with the blocked domain in the job log, not a silent skip.
# release.yaml intentionally stays on egress-policy: audit -- its last
# successful run predates several since-added jobs (compat-matrix,
# verify-release), so there is no fresh audit data to build a real
# allowlist from yet. See #26.
# The Image Build job is new (#26) and has no audit-mode run of its own yet,
# so its allowed-endpoints was assembled from its known fetches (Docker Hub
# base image pulls, the Alpine apk index, the Go module proxy/sumdb) rather
# than observed history; it builds the Dockerfile for every platform
# release.yaml builds, without pushing, so a base-digest bump that drops a
# pinned apk package version fails on every PR instead of only after a
# release tag is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            cli.codecov.io:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      # go mod download/go build already refuse to proceed on a go.sum
      # mismatch (GOSUMDB defaults on) -- this step makes that guarantee an
      # explicit, auditable CI check instead of an implicit side effect of
      # whichever later step happens to trigger the download. See #26 and
      # docs/dependency-incident-response.md.
      - name: Verify module checksums against go.sum
        run: go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: binary
          args: --timeout=3m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/nfs-quota-agent-linux-amd64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/nfs-quota-agent-linux-arm64 ./cmd/nfs-quota-agent

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: bin/

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # go-licenses resolves each module's documented source to classify
          # its license; the domain set below tracks go.sum and may need a
          # new entry when a dependency changes -- a block here fails this
          # job with the blocked domain named in the log, not silently.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            golang.org:443
            google.golang.org:443
            gopkg.in:443
            k8s.io:443
            sigs.k8s.io:443
            go.yaml.in:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Check dependency licenses against the explicit allowlist
        run: go tool go-licenses check ./... --allowed_licenses="$(paste -sd, hack/allowed-licenses.txt)"

      - name: Verify THIRD_PARTY_LICENSES.md is up to date
        run: |
          go tool go-licenses report ./... --template hack/third-party-licenses.tmpl > /tmp/THIRD_PARTY_LICENSES.md
          diff -u THIRD_PARTY_LICENSES.md /tmp/THIRD_PARTY_LICENSES.md || \
            (echo "::error::THIRD_PARTY_LICENSES.md is stale — run 'make license' and commit the result" && exit 1)

  compat-matrix:
    name: Compatibility Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate hack/compatibility-matrix.json shape
        run: make compat-matrix

  generate:
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Verify generated deepcopy code and CRD manifest are up to date
        # controller-gen's import formatting depends on the other files already
        # present in the target package directory, so — unlike the license-check
        # diff above — the committed files must be regenerated in place (backed
        # up first) rather than compared against output written to a scratch
        # directory; the latter produces spurious diffs unrelated to staleness.
        run: |
          cp internal/apis/quota/v1alpha1/zz_generated.deepcopy.go /tmp/zz_generated.deepcopy.go.orig
          cp charts/nfs-quota-agent/crds/quota.nfs.io_quotapolicies.yaml /tmp/quota.nfs.io_quotapolicies.yaml.orig
          make generate
          diff -u /tmp/zz_generated.deepcopy.go.orig internal/apis/quota/v1alpha1/zz_generated.deepcopy.go || \
            (echo "::error::internal/apis/quota/v1alpha1/zz_generated.deepcopy.go is stale — run 'make generate' and commit the result" && exit 1)
          diff -u /tmp/quota.nfs.io_quotapolicies.yaml.orig charts/nfs-quota-agent/crds/quota.nfs.io_quotapolicies.yaml || \
            (echo "::error::charts/nfs-quota-agent/crds/quota.nfs.io_quotapolicies.yaml is stale — run 'make generate' and commit the result" && exit 1)

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            get.helm.sh:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.2.4'

      - name: Lint Helm chart
        run: helm lint ./charts/nfs-quota-agent

      - name: Template Helm chart (smoke test)
        run: helm template ./charts/nfs-quota-agent --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true --set podDisruptionBudget.enabled=true

  image-build:
    name: Image Build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          # Assembled from this job's known fetches: GitHub Actions runner
          # control-plane and checkout (github.com, api.github.com,
          # *.githubusercontent.com, pkg-containers.githubusercontent.com and
          # ghcr.io for the QEMU/buildx setup actions' own container pulls),
          # the golang:1.26-alpine and alpine:3.24 base image pulls from
          # Docker Hub (registry-1.docker.io, auth.docker.io, index.docker.io,
          # production.cloudflare.docker.com, production.cloudfront.docker.com,
          # docker.io), the Alpine apk
          # index the pinned package versions resolve against
          # (dl-cdn.alpinelinux.org), and the Go module proxy/sumdb the
          # builder stage's `go mod download` reaches (proxy.golang.org,
          # sum.golang.org, storage.googleapis.com as the proxy's backing
          # store). A block here shows up as a named domain in this job's
          # log, not a silent failure.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            index.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            docker.io:443
            dl-cdn.alpinelinux.org:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          # Multi-arch manifest-list digest for tonistiigi/binfmt:latest,
          # resolved from Docker Hub on 2026-09-02. Pin it so the CI
          # emulation environment cannot drift underneath release builds.
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Builds every platform release.yaml builds (linux/amd64, linux/arm64,
      # linux/arm/v7) without pushing or loading, so a base-digest bump that
      # drops a pinned apk package version from the Alpine index (or from an
      # arch-specific index) fails here on every PR instead of surfacing only
      # after a release tag is pushed.
      - name: Build image for all release platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            mirror.gcr.io:443
            check.trivy.dev:443
            vuln.go.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.26'
          go-package: './...'

  dependency-review:
    name: Dependency Review
    # Dependency Review compares a pull request with its base; it has no
    # meaningful push-event input. High includes critical findings and follows
    # this privileged agent's high-risk treatment for security-sensitive paths.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # The action otherwise queries OpenSSF Scorecard and deps.dev, which
          # are outside this job's evidence-backed GitHub-only allowlist.
          show-openssf-scorecard: false
