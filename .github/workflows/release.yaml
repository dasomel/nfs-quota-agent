# Every job's first step is step-security/harden-runner in audit mode --
# see the identical block in ci.yaml for why audit rather than block.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests
        run: go test -v ./...

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: CHANGELOG.md

  build-and-push:
    name: Build and Push Multi-arch Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Sign container image (keyless)
        # Keyless signing: cosign requests a short-lived Fulcio cert bound to
        # this workflow's OIDC identity, signs the image digest with it, and
        # uploads the signature + cert to the public Rekor transparency log.
        # Signing by digest (not tag) avoids tag-mutation TOCTOU. Verify with:
        #   cosign verify --certificate-identity-regexp \
        #     'https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/tags/.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-results.sarif'

  release-binaries:
    name: Release Binaries
    runs-on: ubuntu-latest
    needs: [test, changelog]
    permissions:
      contents: write
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-amd64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-arm64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-armv7 ./cmd/nfs-quota-agent

          # Create checksums
          cd dist && sha256sum * > checksums.txt

      - name: Sign checksums.txt (keyless, offline-verifiable bundle)
        # --bundle embeds the Fulcio cert + Rekor inclusion proof in the
        # output file so hack/verify-release.py can verify it later without
        # network access to Rekor/Fulcio. checksums.txt covers all 3
        # binaries, so this one signature covers them transitively.
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Checksum checksums.txt bundle
        run: |
          cd dist
          sha256=$(sha256sum checksums.txt.bundle | cut -d' ' -f1)
          jq -n --arg file "checksums.txt.bundle" --arg sha256 "$sha256" '{file: $file, sha256: $sha256}' > checksums-bundle-meta.json

      - name: Upload checksums signature metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-bundle-meta
          path: dist/checksums-bundle-meta.json

      - name: Generate SBOM for binaries
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./dist
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Checksum SBOM
        run: |
          cd dist
          sha256=$(sha256sum sbom.spdx.json | cut -d' ' -f1)
          jq -n --arg file "sbom.spdx.json" --arg sha256 "$sha256" '{file: $file, sha256: $sha256}' > sbom-meta.json

      - name: Upload SBOM metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-sbom-meta
          path: dist/sbom-meta.json

      - name: Download changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: CHANGELOG.md
          files: |
            dist/nfs-quota-agent-*
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/sbom.spdx.json
          generate_release_notes: false

      - name: Upload binary checksums for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-checksums
          path: dist/checksums.txt

  helm-release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [test, changelog]
    permissions:
      contents: write
      packages: write # needed to push the chart to the ghcr.io OCI registry
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    outputs:
      chart_file: ${{ steps.package.outputs.chart_file }}
      chart_version: ${{ steps.package.outputs.chart_version }}
      chart_sha256: ${{ steps.checksum.outputs.chart_sha256 }}
      chart_oci_ref: ${{ steps.oci_push.outputs.oci_ref }}
      chart_oci_digest: ${{ steps.oci_push.outputs.oci_digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.2.4'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package Helm chart
        id: package
        run: |
          helm package ./charts/nfs-quota-agent -d .helm-releases
          chart_file=$(basename .helm-releases/*.tgz)
          echo "chart_file=${chart_file}" >> "$GITHUB_OUTPUT"
          echo "chart_name=$(helm show chart ./charts/nfs-quota-agent | awk '/^name:/ {print $2}')" >> "$GITHUB_OUTPUT"
          echo "chart_version=$(helm show chart ./charts/nfs-quota-agent | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Checksum Helm chart
        id: checksum
        run: |
          cd .helm-releases
          sha256sum "${{ steps.package.outputs.chart_file }}" > "${{ steps.package.outputs.chart_file }}.sha256"
          echo "chart_sha256=$(cut -d' ' -f1 "${{ steps.package.outputs.chart_file }}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart (keyless, offline-verifiable bundle)
        # Same rationale as checksums.txt in release-binaries: --bundle
        # embeds the cert + Rekor inclusion proof for offline verification.
        run: cosign sign-blob --yes --bundle ".helm-releases/${{ steps.package.outputs.chart_file }}.bundle" ".helm-releases/${{ steps.package.outputs.chart_file }}"

      - name: Checksum Helm chart bundle
        run: |
          cd .helm-releases
          sha256=$(sha256sum "${{ steps.package.outputs.chart_file }}.bundle" | cut -d' ' -f1)
          jq -n --arg file "${{ steps.package.outputs.chart_file }}.bundle" --arg sha256 "$sha256" '{file: $file, sha256: $sha256}' > chart-bundle-meta.json

      - name: Upload chart signature metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-bundle-meta
          path: .helm-releases/chart-bundle-meta.json

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart
          path: .helm-releases/*.tgz

      - name: Publish Helm chart as release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            .helm-releases/${{ steps.package.outputs.chart_file }}
            .helm-releases/${{ steps.package.outputs.chart_file }}.sha256
            .helm-releases/${{ steps.package.outputs.chart_file }}.bundle
          generate_release_notes: false

      - name: Log in to GHCR for Helm OCI push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI registry
        id: oci_push
        # Additive publish target alongside the existing GitHub-release-asset
        # publish above; does not replace it. helm push's stdout includes
        # "Digest: sha256:<...>" for the pushed OCI artifact.
        run: |
          push_output=$(helm push ".helm-releases/${{ steps.package.outputs.chart_file }}" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts" 2>&1 | tee /dev/stderr)
          digest=$(printf '%s\n' "$push_output" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1)
          echo "oci_ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/${{ steps.package.outputs.chart_name }}" >> "$GITHUB_OUTPUT"
          echo "oci_digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart OCI artifact
        if: steps.oci_push.outputs.oci_digest != ''
        # OCI artifacts get their own cosign signature by registry digest,
        # separate from the sign-blob bundle above which covers the .tgz
        # release asset.
        run: cosign sign --yes "${{ steps.oci_push.outputs.oci_ref }}@${{ steps.oci_push.outputs.oci_digest }}"

  release-manifest:
    name: Publish Release Manifest
    runs-on: ubuntu-latest
    needs: [build-and-push, release-binaries, helm-release]
    permissions:
      contents: write
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download binary checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-checksums

      - name: Download binary SBOM metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-sbom-meta

      - name: Download checksums signature metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-bundle-meta

      - name: Download chart signature metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-bundle-meta

      - name: Generate release manifest
        id: manifest
        run: |
          compat_sha256=$(sha256sum hack/compatibility-matrix.json | cut -d' ' -f1)
          jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg workflow_run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg image "${{ needs.build-and-push.outputs.image }}" \
            --arg image_digest "${{ needs.build-and-push.outputs.digest }}" \
            --arg chart_file "${{ needs.helm-release.outputs.chart_file }}" \
            --arg chart_version "${{ needs.helm-release.outputs.chart_version }}" \
            --arg chart_sha256 "${{ needs.helm-release.outputs.chart_sha256 }}" \
            --arg chart_oci_ref "${{ needs.helm-release.outputs.chart_oci_ref }}" \
            --arg chart_oci_digest "${{ needs.helm-release.outputs.chart_oci_digest }}" \
            --arg compat_file "compatibility-matrix.json" \
            --arg compat_sha256 "$compat_sha256" \
            --slurpfile binaries <(awk '{print "{\"file\":\""$2"\",\"sha256\":\""$1"\"}"}' checksums.txt | jq -s .) \
            --slurpfile sbom sbom-meta.json \
            --slurpfile checksums_sig checksums-bundle-meta.json \
            --slurpfile chart_sig chart-bundle-meta.json \
            '{
              schemaVersion: 3,
              tag: $tag,
              sourceCommit: $commit,
              workflowRun: $workflow_run,
              image: { repository: $image, digest: $image_digest },
              chart: ({ file: $chart_file, version: $chart_version, sha256: $chart_sha256 }
                + (if $chart_oci_digest != "" then { ociRef: $chart_oci_ref, ociDigest: $chart_oci_digest } else {} end)),
              binaries: $binaries[0],
              sbom: $sbom[0],
              compatibilityMatrix: { file: $compat_file, sha256: $compat_sha256 },
              signatures: {
                checksums: $checksums_sig[0],
                chart: $chart_sig[0]
              }
            }' > release-manifest.json
          cat release-manifest.json

      - name: Sign release manifest (keyless, offline-verifiable bundle)
        # Signs release-manifest.json itself, which already references every
        # other artifact by digest/sha256 -- one signature here transitively
        # covers the whole release: an attacker cannot swap a referenced
        # artifact without changing its recorded sha256, which would then
        # fail this signature. The per-artifact bundles referenced under
        # "signatures" above (checksums.txt, the chart .tgz) are for
        # someone who downloaded only that one artifact and wants to verify
        # it standalone -- defense-in-depth, not because the manifest
        # signature alone is insufficient.
        run: cosign sign-blob --yes --bundle release-manifest.json.bundle release-manifest.json

      - name: Publish release manifest
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-manifest.json
            release-manifest.json.bundle
            hack/compatibility-matrix.json
          generate_release_notes: false

  update-changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    needs: [release-binaries]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Generate full changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}"
          git push
