# Every job's first step is step-security/harden-runner in audit mode --
# see the identical block in ci.yaml for why audit rather than block.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests
        run: go test -v ./...

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: CHANGELOG.md

  build-and-push:
    name: Build and Push Multi-arch Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: 'trivy-results.sarif'

  release-binaries:
    name: Release Binaries
    runs-on: ubuntu-latest
    needs: [test, changelog]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-amd64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-arm64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-armv7 ./cmd/nfs-quota-agent

          # Create checksums
          cd dist && sha256sum * > checksums.txt

      - name: Generate SBOM for binaries
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./dist
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Checksum SBOM
        run: |
          cd dist
          sha256=$(sha256sum sbom.spdx.json | cut -d' ' -f1)
          jq -n --arg file "sbom.spdx.json" --arg sha256 "$sha256" '{file: $file, sha256: $sha256}' > sbom-meta.json

      - name: Upload SBOM metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-sbom-meta
          path: dist/sbom-meta.json

      - name: Download changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: CHANGELOG.md
          files: |
            dist/nfs-quota-agent-*
            dist/checksums.txt
            dist/sbom.spdx.json
          generate_release_notes: false

      - name: Upload binary checksums for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-checksums
          path: dist/checksums.txt

  helm-release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [test, changelog]
    permissions:
      contents: write
    outputs:
      chart_file: ${{ steps.package.outputs.chart_file }}
      chart_version: ${{ steps.package.outputs.chart_version }}
      chart_sha256: ${{ steps.checksum.outputs.chart_sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.2.4'

      - name: Package Helm chart
        id: package
        run: |
          helm package ./charts/nfs-quota-agent -d .helm-releases
          chart_file=$(basename .helm-releases/*.tgz)
          echo "chart_file=${chart_file}" >> "$GITHUB_OUTPUT"
          echo "chart_version=$(helm show chart ./charts/nfs-quota-agent | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Checksum Helm chart
        id: checksum
        run: |
          cd .helm-releases
          sha256sum "${{ steps.package.outputs.chart_file }}" > "${{ steps.package.outputs.chart_file }}.sha256"
          echo "chart_sha256=$(cut -d' ' -f1 "${{ steps.package.outputs.chart_file }}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart
          path: .helm-releases/*.tgz

      - name: Publish Helm chart as release asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            .helm-releases/${{ steps.package.outputs.chart_file }}
            .helm-releases/${{ steps.package.outputs.chart_file }}.sha256
          generate_release_notes: false

  release-manifest:
    name: Publish Release Manifest
    runs-on: ubuntu-latest
    needs: [build-and-push, release-binaries, helm-release]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binary checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-checksums

      - name: Download binary SBOM metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-sbom-meta

      - name: Generate release manifest
        id: manifest
        run: |
          compat_sha256=$(sha256sum hack/compatibility-matrix.json | cut -d' ' -f1)
          jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg workflow_run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg image "${{ needs.build-and-push.outputs.image }}" \
            --arg image_digest "${{ needs.build-and-push.outputs.digest }}" \
            --arg chart_file "${{ needs.helm-release.outputs.chart_file }}" \
            --arg chart_version "${{ needs.helm-release.outputs.chart_version }}" \
            --arg chart_sha256 "${{ needs.helm-release.outputs.chart_sha256 }}" \
            --arg compat_file "compatibility-matrix.json" \
            --arg compat_sha256 "$compat_sha256" \
            --slurpfile binaries <(awk '{print "{\"file\":\""$2"\",\"sha256\":\""$1"\"}"}' checksums.txt | jq -s .) \
            --slurpfile sbom sbom-meta.json \
            '{
              schemaVersion: 2,
              tag: $tag,
              sourceCommit: $commit,
              workflowRun: $workflow_run,
              image: { repository: $image, digest: $image_digest },
              chart: { file: $chart_file, version: $chart_version, sha256: $chart_sha256 },
              binaries: $binaries[0],
              sbom: $sbom[0],
              compatibilityMatrix: { file: $compat_file, sha256: $compat_sha256 }
            }' > release-manifest.json
          cat release-manifest.json

      - name: Publish release manifest
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            release-manifest.json
            hack/compatibility-matrix.json
          generate_release_notes: false

  update-changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    needs: [release-binaries]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Generate full changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}"
          git push
