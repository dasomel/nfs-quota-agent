# Every job's first step is step-security/harden-runner in audit mode --
# see the identical block in ci.yaml for why audit rather than block.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Run tests
        run: go test -v ./...

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changelog
          path: CHANGELOG.md

  build-and-push:
    name: Build and Push Multi-arch Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Sign container image (keyless)
        # Keyless signing: cosign requests a short-lived Fulcio cert bound to
        # this workflow's OIDC identity, signs the image digest with it, and
        # uploads the signature + cert to the public Rekor transparency log.
        # Signing by digest (not tag) avoids tag-mutation TOCTOU. Verify with:
        #   cosign verify --certificate-identity-regexp \
        #     'https://github.com/${{ github.repository }}/.github/workflows/release.yaml@refs/tags/.*' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-results.sarif'

  release-binaries:
    name: Release Binaries
    runs-on: ubuntu-latest
    needs: [test, changelog]
    permissions:
      contents: write
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # #26: build-input provenance for release-manifest schemaVersion 4.
      # Recorded here (not hardcoded in release-manifest's jq) because this
      # is the job that actually has the toolchain installed -- `go version`
      # reflects what setup-go resolved for '1.27' above, not the workflow
      # input string, and go.sum/go.mod are hashed from the checked-out
      # source this job builds from. Dockerfile's two `FROM ...@sha256:`
      # lines are parsed rather than hardcoded so this step can't drift from
      # the image the runtime stage actually ships (the same drift class
      # CLAUDE.md's "Go version bump touches four places" gotcha warns
      # about). apk package closure sha256 is deliberately NOT recorded
      # here: /licenses/os-packages-manifest.txt only exists inside the
      # built image, and this job doesn't build/extract that image (the
      # build-and-push job does, via buildx, with no local filesystem
      # export) -- see the "apk packages are recorded, not pinned" decision
      # record on #26 for why the closure is intentionally unpinned upstream
      # of this too; the release image's own Syft SBOM remains the record.
      - name: Record build provenance
        run: |
          # binaryGoVersion (not "goVersion") is deliberately named for what
          # it actually is: the toolchain that compiled the three release
          # binaries via `go build` below, via setup-go's '1.27' above. It is
          # NOT the compiler that produced the container image's binary --
          # that is a separate build (a Dockerfile RUN inside the
          # build-and-push job's builder stage) using builderImage's own Go
          # toolchain, which can differ (see the #26 comment history on Go
          # 1.26 vs Dockerfile's 1.27 toolchain drift before that was fixed).
          # An independent review of PR #120 caught the original "goVersion"
          # name implying it covered both.
          binary_go_version=$(go version | awk '{print $3}')
          go_sum_sha256=$(sha256sum go.sum | cut -d' ' -f1)
          go_mod_sha256=$(sha256sum go.mod | cut -d' ' -f1)
          source_tree_hash=$(git rev-parse 'HEAD^{tree}')
          source_commit=$(git rev-parse HEAD)

          extract_image() {
            local line="$1" full
            full=$(echo "$line" | grep -oE '[^ ]+@sha256:[0-9a-f]{64}')
            echo "${full%@*}|${full#*@}"
          }

          builder_line=$(grep -m1 '^FROM' Dockerfile)
          runtime_line=$(grep '^FROM' Dockerfile | tail -1)
          IFS='|' read -r builder_ref builder_digest <<< "$(extract_image "$builder_line")"
          IFS='|' read -r runtime_ref runtime_digest <<< "$(extract_image "$runtime_line")"

          test -n "$builder_digest" || { echo "Could not parse a @sha256: digest from Dockerfile's first FROM line: $builder_line" >&2; exit 1; }
          test -n "$runtime_digest" || { echo "Could not parse a @sha256: digest from Dockerfile's last FROM line: $runtime_line" >&2; exit 1; }

          jq -n \
            --arg binaryGoVersion "$binary_go_version" \
            --arg goSumSha256 "$go_sum_sha256" \
            --arg goModSha256 "$go_mod_sha256" \
            --arg sourceCommit "$source_commit" \
            --arg sourceTreeHash "$source_tree_hash" \
            --arg builderRef "$builder_ref" \
            --arg builderDigest "$builder_digest" \
            --arg runtimeRef "$runtime_ref" \
            --arg runtimeDigest "$runtime_digest" \
            '{
              binaryGoVersion: $binaryGoVersion,
              goSum: { file: "go.sum", sha256: $goSumSha256 },
              goMod: { file: "go.mod", sha256: $goModSha256 },
              sourceCommit: $sourceCommit,
              sourceTreeHash: $sourceTreeHash,
              builderImage: { repository: $builderRef, digest: $builderDigest },
              runtimeImage: { repository: $runtimeRef, digest: $runtimeDigest }
            }' > provenance-meta.json

          # Fail closed here rather than signing a hollow provenance object:
          # an independent review of PR #120 found that a valid-JSON `[]` or
          # `{}` provenance-meta.json would have been merged into
          # release-manifest.json (as null, or as a v4 provenance with no
          # required fields) and then SIGNED as though it were real
          # build-input provenance. scripts/ci/check-provenance-meta.sh is
          # the single source of truth for this shape check -- the same
          # script has its own test (scripts/ci/test-check-provenance-meta.sh)
          # exercising [], {}, and a good file without needing a release.
          bash scripts/ci/check-provenance-meta.sh provenance-meta.json
          cat provenance-meta.json

      - name: Upload provenance metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-meta
          path: provenance-meta.json

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-amd64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-arm64 ./cmd/nfs-quota-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/nfs-quota-agent-linux-armv7 ./cmd/nfs-quota-agent

          # Create checksums
          cd dist && sha256sum * > checksums.txt

      - name: Sign checksums.txt (keyless, offline-verifiable bundle)
        # --bundle embeds the Fulcio cert + Rekor inclusion proof in the
        # output file so hack/verify-release.py can verify it later without
        # network access to Rekor/Fulcio. checksums.txt covers all 3
        # binaries, so this one signature covers them transitively.
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Checksum checksums.txt bundle
        run: |
          cd dist
          sha256=$(sha256sum checksums.txt.bundle | cut -d' ' -f1)
          jq -n --arg file "checksums.txt.bundle" --arg sha256 "$sha256" '{file: $file, sha256: $sha256}' > checksums-bundle-meta.json

      - name: Upload checksums signature metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-bundle-meta
          path: dist/checksums-bundle-meta.json

      - name: Generate SBOM for binaries
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: ./dist
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Checksum SBOM
        run: |
          cd dist
          sha256=$(sha256sum sbom.spdx.json | cut -d' ' -f1)
          jq -n --arg file "sbom.spdx.json" --arg sha256 "$sha256" '{file: $file, sha256: $sha256}' > sbom-meta.json

      - name: Upload SBOM metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-sbom-meta
          path: dist/sbom-meta.json

      - name: Download changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: changelog

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: CHANGELOG.md
          files: |
            dist/nfs-quota-agent-*
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/sbom.spdx.json
          generate_release_notes: false

      - name: Upload binary checksums for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-checksums
          path: dist/checksums.txt

  helm-release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [test, changelog]
    permissions:
      contents: write
      packages: write # needed to push the chart to the ghcr.io OCI registry
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    outputs:
      chart_file: ${{ steps.package.outputs.chart_file }}
      chart_version: ${{ steps.package.outputs.chart_version }}
      chart_sha256: ${{ steps.checksum.outputs.chart_sha256 }}
      chart_oci_ref: ${{ steps.oci_push.outputs.oci_ref }}
      chart_oci_digest: ${{ steps.oci_push.outputs.oci_digest }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v4.2.4'

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package Helm chart
        id: package
        run: |
          helm package ./charts/nfs-quota-agent -d .helm-releases
          chart_file=$(basename .helm-releases/*.tgz)
          echo "chart_file=${chart_file}" >> "$GITHUB_OUTPUT"
          echo "chart_name=$(helm show chart ./charts/nfs-quota-agent | awk '/^name:/ {print $2}')" >> "$GITHUB_OUTPUT"
          echo "chart_version=$(helm show chart ./charts/nfs-quota-agent | awk '/^version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Checksum Helm chart
        id: checksum
        run: |
          cd .helm-releases
          sha256sum "${{ steps.package.outputs.chart_file }}" > "${{ steps.package.outputs.chart_file }}.sha256"
          echo "chart_sha256=$(cut -d' ' -f1 "${{ steps.package.outputs.chart_file }}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart (keyless, offline-verifiable bundle)
        # Same rationale as checksums.txt in release-binaries: --bundle
        # embeds the cert + Rekor inclusion proof for offline verification.
        run: cosign sign-blob --yes --bundle ".helm-releases/${{ steps.package.outputs.chart_file }}.bundle" ".helm-releases/${{ steps.package.outputs.chart_file }}"

      - name: Checksum Helm chart bundle
        run: |
          cd .helm-releases
          sha256=$(sha256sum "${{ steps.package.outputs.chart_file }}.bundle" | cut -d' ' -f1)
          jq -n --arg file "${{ steps.package.outputs.chart_file }}.bundle" --arg sha256 "$sha256" '{file: $file, sha256: $sha256}' > chart-bundle-meta.json

      - name: Upload chart signature metadata for manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-bundle-meta
          path: .helm-releases/chart-bundle-meta.json

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-chart
          path: .helm-releases/*.tgz

      - name: Publish Helm chart as release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            .helm-releases/${{ steps.package.outputs.chart_file }}
            .helm-releases/${{ steps.package.outputs.chart_file }}.sha256
            .helm-releases/${{ steps.package.outputs.chart_file }}.bundle
          generate_release_notes: false

      - name: Log in to GHCR for Helm OCI push
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI registry
        id: oci_push
        # Additive publish target alongside the existing GitHub-release-asset
        # publish above; does not replace it. helm push's stdout includes
        # "Digest: sha256:<...>" for the pushed OCI artifact.
        run: |
          push_output=$(helm push ".helm-releases/${{ steps.package.outputs.chart_file }}" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts" 2>&1 | tee /dev/stderr)
          digest=$(printf '%s\n' "$push_output" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1)
          echo "oci_ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/${{ steps.package.outputs.chart_name }}" >> "$GITHUB_OUTPUT"
          echo "oci_digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart OCI artifact
        if: steps.oci_push.outputs.oci_digest != ''
        # OCI artifacts get their own cosign signature by registry digest,
        # separate from the sign-blob bundle above which covers the .tgz
        # release asset.
        run: cosign sign --yes "${{ steps.oci_push.outputs.oci_ref }}@${{ steps.oci_push.outputs.oci_digest }}"

  release-manifest:
    name: Publish Release Manifest
    runs-on: ubuntu-latest
    needs: [build-and-push, release-binaries, helm-release]
    permissions:
      contents: write
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download binary checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-checksums

      - name: Download binary SBOM metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-sbom-meta

      - name: Download checksums signature metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-bundle-meta

      - name: Download chart signature metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-bundle-meta

      - name: Download build provenance metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-meta

      - name: Validate build provenance metadata
        # Defense in depth alongside the release-binaries job's own check
        # (which produced this artifact): re-validated here, immediately
        # before the --slurpfile merge below, so a malformed/empty
        # provenance-meta.json (including the concatenated-JSON-documents
        # variant a Codex delta re-check on PR #120 found -- see
        # check-provenance-meta.sh's own comments) can never reach the
        # signed manifest even if the artifact were altered in transit
        # between jobs.
        run: bash scripts/ci/check-provenance-meta.sh provenance-meta.json

      - name: Generate release manifest
        id: manifest
        run: |
          compat_sha256=$(sha256sum hack/compatibility-matrix.json | cut -d' ' -f1)
          jq -n \
            --arg tag "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg workflow_run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg image "${{ needs.build-and-push.outputs.image }}" \
            --arg image_digest "${{ needs.build-and-push.outputs.digest }}" \
            --arg chart_file "${{ needs.helm-release.outputs.chart_file }}" \
            --arg chart_version "${{ needs.helm-release.outputs.chart_version }}" \
            --arg chart_sha256 "${{ needs.helm-release.outputs.chart_sha256 }}" \
            --arg chart_oci_ref "${{ needs.helm-release.outputs.chart_oci_ref }}" \
            --arg chart_oci_digest "${{ needs.helm-release.outputs.chart_oci_digest }}" \
            --arg compat_file "compatibility-matrix.json" \
            --arg compat_sha256 "$compat_sha256" \
            --slurpfile binaries <(awk '{print "{\"file\":\""$2"\",\"sha256\":\""$1"\"}"}' checksums.txt | jq -s .) \
            --slurpfile sbom sbom-meta.json \
            --slurpfile checksums_sig checksums-bundle-meta.json \
            --slurpfile chart_sig chart-bundle-meta.json \
            --slurpfile provenance provenance-meta.json \
            '
            # Belt-and-suspenders alongside the two check-provenance-meta.sh
            # calls above: --slurpfile always reads every top-level JSON
            # document in provenance-meta.json into an array, so even with
            # both shell-level checks in place, the merge itself refuses to
            # pick $provenance[0] of anything but a single-document file --
            # a Codex delta re-check on PR #120 found the previous version
            # of this jq filter would silently take [0] and drop the rest.
            ($provenance | length) as $provenance_doc_count |
            if $provenance_doc_count != 1 then
              error("provenance-meta.json must contain exactly one JSON document, found \($provenance_doc_count)")
            else . end |
            {
              schemaVersion: 4,
              tag: $tag,
              sourceCommit: $commit,
              workflowRun: $workflow_run,
              image: { repository: $image, digest: $image_digest },
              chart: ({ file: $chart_file, version: $chart_version, sha256: $chart_sha256 }
                + (if $chart_oci_digest != "" then { ociRef: $chart_oci_ref, ociDigest: $chart_oci_digest } else {} end)),
              binaries: $binaries[0],
              sbom: $sbom[0],
              compatibilityMatrix: { file: $compat_file, sha256: $compat_sha256 },
              signatures: {
                checksums: $checksums_sig[0],
                chart: $chart_sig[0]
              },
              provenance: $provenance[0]
            }' > release-manifest.json
          cat release-manifest.json

      - name: Sign release manifest (keyless, offline-verifiable bundle)
        # Signs release-manifest.json itself, which already references every
        # other artifact by digest/sha256 -- one signature here transitively
        # covers the whole release: an attacker cannot swap a referenced
        # artifact without changing its recorded sha256, which would then
        # fail this signature. The per-artifact bundles referenced under
        # "signatures" above (checksums.txt, the chart .tgz) are for
        # someone who downloaded only that one artifact and wants to verify
        # it standalone -- defense-in-depth, not because the manifest
        # signature alone is insufficient.
        run: cosign sign-blob --yes --bundle release-manifest.json.bundle release-manifest.json

      - name: Publish release manifest
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-manifest.json
            release-manifest.json.bundle
            hack/compatibility-matrix.json
          generate_release_notes: false

  release-bundle:
    name: Publish Offline Install Bundle
    # Appended after release-manifest, not folded into it: release-manifest
    # signs release-manifest.json itself, and this job's bundle needs that
    # already-published, already-signed manifest as an input (for the image
    # digest and chart sha256 it checks against) -- building the bundle
    # first and adding a "bundle" field to the manifest before signing
    # would create a circular dependency instead. hack/verify-release.py's
    # --bundle mode documents this: the bundle's own sha256 is checked
    # against a sidecar <bundle>.sha256 file (published by this job, same
    # convention as the chart's <chart>.tgz.sha256 in helm-release above),
    # not a manifest field.
    runs-on: ubuntu-latest
    needs: [build-and-push, helm-release, release-manifest]
    permissions:
      contents: write
      id-token: write # needed for keyless cosign signing (Fulcio OIDC token)
    steps:
      - name: Harden Runner
        # audit, not block: this job needs egress to the Ubuntu package
        # archive (installing skopeo) and to ghcr.io (pulling the just-
        # published multi-arch image by digest) -- see ci.yaml:16-19 for
        # why "audit" rather than "block" is this repo's current default
        # for release.yaml until an allowlist exists for these plus the
        # existing jobs' hosts (GHCR, Sigstore Fulcio/Rekor, GitHub
        # Releases).
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download release manifest and Helm chart from this release
        # release-manifest and helm-release already published these as
        # GitHub Release assets on this same tag (needs: above guarantees
        # they ran first) -- downloading from the release, rather than
        # re-deriving another copy from job outputs, guarantees the bundle
        # packages exactly what a consumer downloading the release would
        # also get.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'release-manifest.json' \
            --pattern 'release-manifest.json.bundle' \
            --pattern 'sbom.spdx.json' \
            --pattern '*.tgz' \
            --dir .
          # Fail loudly here, not three steps later inside `make
          # release-bundle` (HIGH, Codex critic pass on #117): a bundle
          # packaged without the manifest's own cosign signature can never
          # pass `verify-release.py --bundle --require-signatures`, so a
          # silently-missing download is worse than a build failure now.
          for f in release-manifest.json release-manifest.json.bundle; do
            test -f "$f" || { echo "Expected $f to be downloaded from release ${{ github.ref_name }} (published by the release-manifest job, which this job depends on via needs:) but it is missing" >&2; exit 1; }
          done

      - name: Log in to Container Registry
        # Needed so skopeo (invoked by `make release-bundle`) can pull the
        # just-published image by digest from GHCR.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build offline install bundle
        run: |
          set -euo pipefail
          chart_tgz_matches=$(find . -maxdepth 1 -name '*.tgz')
          chart_tgz_count=$(printf '%s\n' "$chart_tgz_matches" | grep -c . || true)
          if [ "$chart_tgz_count" -ne 1 ]; then
            echo "Expected exactly one *.tgz downloaded from the release, found $chart_tgz_count: $chart_tgz_matches" >&2
            exit 1
          fi
          chart_tgz="$chart_tgz_matches"
          make release-bundle \
            IMAGE_REF="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}" \
            CHART_TGZ="$chart_tgz" \
            RELEASE_DIR=. \
            REQUIRE_SIGNED_MANIFEST=1 \
            BUNDLE_VERSION="${{ github.ref_name }}"
          bundle_file="nfs-quota-agent-${{ github.ref_name }}-offline.tar.gz"
          echo "BUNDLE_FILE=$bundle_file" >> "$GITHUB_ENV"
          sha256sum "$bundle_file" > "$bundle_file.sha256"

      - name: Sign offline install bundle (keyless, offline-verifiable bundle)
        # Same rationale as checksums.txt/the chart .tgz elsewhere in this
        # workflow: --bundle embeds the Fulcio cert + Rekor inclusion proof
        # so hack/verify-release.py can verify it later without network
        # access to Rekor/Fulcio.
        run: cosign sign-blob --yes --bundle "${{ env.BUNDLE_FILE }}.bundle" "${{ env.BUNDLE_FILE }}"

      - name: Publish offline install bundle
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ env.BUNDLE_FILE }}
            ${{ env.BUNDLE_FILE }}.sha256
            ${{ env.BUNDLE_FILE }}.bundle
          generate_release_notes: false

  update-changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    needs: [release-binaries]
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Generate full changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for ${{ github.ref_name }}"
          git push
