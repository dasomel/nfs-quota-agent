name: Air-Gap E2E Quota Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'charts/**'
      - 'Dockerfile'
      - 'Makefile'
      - 'hack/**'
      - '.github/workflows/e2e-airgap.yaml'
      - 'scripts/e2e/**'
  schedule:
    # Weekly on Mondays at 03:00 UTC.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs only. schedule and workflow_dispatch both have a
  # null pull_request.number and resolve github.ref to refs/heads/main, so a
  # constant `true` would let a manual dispatch kill the weekly run (and vice
  # versa). This job uploads no artifacts, so a cancelled run loses the whole
  # xfs/ext4/btrfs matrix -- the project's only real-kernel enforcement evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e-airgap:
    name: Air-Gap E2E (${{ matrix.fs }} + Zero-Egress Install)
    # D1 (2026-11-04, revised): back on ubuntu-latest. The 2026-10 pin to
    # ubuntu-24.04 worked around `kind load docker-image` failing on 26.04
    # (`ctr ... NotFound content digest`); D2 in Install Host Tools now fixes
    # that at the source (#217). The ext4 kernel-module break (7.0-azure
    # kernels) is handled there too. Escape hatch if a future image breaks E2E
    # on the runner side: pin to the last passing ubuntu-NN.04 again.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [xfs, ext4, btrfs]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          # This job-wide allowlist is needed for setup: toolchain, base images,
          # OS packaging (apt mirrors), and helm/kind downloads.
          #
          # ZERO-EGRESS CONTRACT FOR INSTALL / UPGRADE / ROLLBACK:
          # In Stage C, the agent image is loaded into kind ONLY from the
          # offline bundle's OCI archive (images/nfs-quota-agent-image.tar)
          # via kind load image-archive. Helm uses image.pullPolicy=Never and
          # pins image.digest only when containerd exposes a repoDigest for the
          # loaded archive; otherwise the script logs inspecti output and uses
          # the locally loaded e2e tag. Node-side registry blocking and event
          # assertions in the script enforce C--E independently of this list.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            dl-cdn.alpinelinux.org:443
            docker.io:443
            registry-1.docker.io:443
            auth.docker.io:443
            index.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            packages.microsoft.com:443
            get.helm.sh:443
            deb.debian.org:80
            deb.debian.org:443
            security.debian.org:80
            security.debian.org:443
            ports.ubuntu.com:80
            ports.ubuntu.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Host Tools (${{ matrix.fs }}, NFS, Skopeo, Kind)
        run: |
          set -euo pipefail
          # Remove foreign repos (e.g. Google Chrome) not permitted under harden-runner egress policy
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google*.list /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* || true
          # packages.microsoft.com is unused here and intermittently 403s, which fails apt-get update (PR #218 run 41919871499)
          sudo rm -f /etc/apt/sources.list.d/*microsoft* || true
          # D2 (#217): Docker 29 (ubuntu-26.04) enables the containerd image store by
          # default; with it, `kind load docker-image` (docker save | ctr import
          # --all-platforms) fails on blobs for platforms never pulled -- kind's
          # documented known issue (kind#3795, open). Turn the store off so Docker
          # uses the classic store, the same state as Docker 28 on ubuntu-24.04 where
          # E2E passes. Host-wide, but the runner is ephemeral. Must precede any
          # docker pull (all happen in run-airgap-e2e.sh).
          sudo mkdir -p /etc/docker
          sudo python3 -c 'import json,os; p="/etc/docker/daemon.json"; d=json.load(open(p)) if os.path.exists(p) else {}; d.setdefault("features",{})["containerd-snapshotter"]=False; json.dump(d,open(p,"w"),indent=2)'
          sudo systemctl restart docker
          echo "docker $(docker version --format '{{.Server.Version}}'), storage driver: $(docker info --format '{{.Driver}}')"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends nfs-kernel-server nfs-common xfsprogs e2fsprogs quota btrfs-progs skopeo
          if [ "${{ matrix.fs }}" = "ext4" ]; then
            # Up to 6.17-azure, quota_tree/quota_v2 ship in linux-modules-extra;
            # linux-azure-7.0 dropped that package and ships them in base
            # linux-modules (noble Contents-amd64, #217). Try -extra only if either
            # module's modinfo fails; a failed install is tolerated because
            # modprobe below is the real gate.
            if ! sudo modinfo quota_tree >/dev/null 2>&1 || ! sudo modinfo quota_v2 >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" \
                || echo "linux-modules-extra-$(uname -r) unavailable; relying on modprobe below"
            fi
            # -a loads both as separate modules; a bare "modprobe quota_tree
            # quota_v2" passes quota_v2 as a module PARAMETER to quota_tree
            # (dmesg: "quota_tree: unknown parameter 'quota_v2' ignored"),
            # silently leaving quota_v2 unloaded.
            sudo modprobe -a quota_tree quota_v2
          fi

          # Install kind binary v0.27.0 with verified sha256 checksum from official release asset kind-linux-amd64.sha256sum
          curl -Lo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          echo "a6875aaea358acf0ac07786b1a6755d08fd640f4c79b7a2e46681cc13f49a04b  /tmp/kind" | sha256sum -c
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          rm -f /tmp/kind

      - name: Run Air-Gap E2E Workflow
        run: |
          set -euo pipefail
          bash scripts/e2e/run-airgap-e2e.sh "${{ matrix.fs }}"
