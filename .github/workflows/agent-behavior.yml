name: Agent Behavior

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  behavior-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate behavior specs
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for file in .agents/behaviors/*/BEHAVIOR.md; do
            [ -f "$file" ] || continue
            count=$((count + 1))
            dir=$(basename "$(dirname "$file")")
            name=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm==1 && /^name:/{sub(/^name:[[:space:]]*/, ""); print; exit}' "$file")
            desc=$(awk 'BEGIN{fm=0} /^---$/{fm++; next} fm==1 && /^description:/{sub(/^description:[[:space:]]*/, ""); print; exit}' "$file")
            test -n "$name" && test -n "$desc" && test "$name" = "$dir"
          done
          test "$count" -gt 0
      - name: Evaluate representative trace
        run: python3 .agents/evals/evaluate.py .agents/evals/reference-trace.json
      - name: Gate operational traces against trusted baseline
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for trace in .agents/evals/traces/*.json; do
            [ -f "$trace" ] || continue
            found=1
            echo "Evaluating $trace"
            python3 .agents/evals/gate.py \
              --trace "$trace" \
              --baseline .agents/evals/baseline.eval.json \
              --current-out /tmp/current-agent-eval.json \
              --comparison-out /tmp/agent-eval-comparison.json
          done
          if [ "$found" -eq 0 ]; then
            echo "No operational traces committed; regression gate skipped."
          fi
