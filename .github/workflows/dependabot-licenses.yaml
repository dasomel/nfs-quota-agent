# Precondition for enabling the gomod ecosystem in .github/dependabot.yml
# (see its gomod entry): the License Check job in ci.yaml fails a PR
# whenever THIRD_PARTY_LICENSES.md is stale relative to go.mod/go.sum, and
# regenerating that file is a manual `make license` step. Without this
# workflow, every weekly Go dependency PR from Dependabot would arrive red
# on the License Check job, training reviewers to ignore a gate that
# exists to catch real license changes. This workflow regenerates the
# inventory with the same tooling `make license` uses and commits the
# result back onto the Dependabot branch before a human ever looks at the
# PR. See #26.
#
# The trigger below covers every same-repo PR touching go.mod, go.sum, or
# this workflow file itself -- not only Dependabot's own PRs -- so that the
# read-only half of the pipeline (regenerate + verify-download, including
# the actual upload-artifact/download-artifact network calls under Harden
# Runner's block policy) is exercised by ordinary PRs like the one that
# introduces or edits this file, rather than staying unverified until a
# real Dependabot PR happens to arrive. Only the `commit` job (the one that
# pushes) stays gated to dependabot[bot].
#
# GitHub Actions / Dependabot quirks this workflow works around (found by
# two rounds of independent security review on PR #108):
#
# 1. A push made with the default GITHUB_TOKEN does not trigger new
#    workflow runs (GitHub's own loop-prevention rule). A GITHUB_TOKEN
#    push here would leave the regenerated commit with NO CI at all, and
#    this repo has no branch protection on main requiring green checks,
#    so that unverified commit could be merged as-is. The commit job
#    therefore prefers a fine-grained PAT (secrets.DEPENDABOT_LICENSE_TOKEN,
#    scoped to contents read/write on this repo only) so the resulting
#    `synchronize` event runs full CI like any other push. If the secret
#    is absent it falls back to GITHUB_TOKEN, still commits (regenerating
#    and failing to commit would defeat the whole point), and emits a
#    ::warning:: that the pushed commit's CI will need a maintainer to
#    manually re-run/approve it.
#
#    Maintainer action required: add DEPENDABOT_LICENSE_TOKEN under
#    Settings -> Secrets and variables -> Dependabot (NOT the regular
#    Actions secrets store) -- for a pull_request event opened by
#    dependabot[bot], `secrets.*` resolves from the Dependabot secrets
#    store regardless of where the workflow itself lives.
#
# 2. Dependabot stops auto-rebasing a PR branch once it carries a commit
#    from anyone else, unless that commit's message contains the literal
#    string "[dependabot skip]" -- included in the commit-back message
#    below so Dependabot keeps rebasing the branch onto main as usual.
#
# 3. actions/upload-artifact and actions/download-artifact (v4) do not
#    just talk to github.com/api.github.com: they call the Actions Results
#    Service and then move the actual bytes through Azure Blob Storage.
#    Both endpoints below are named explicitly in GitHub's own runner
#    communication-requirements documentation, not inferred, and both
#    jobs that upload or download the artifact need them under
#    egress-policy: block.
#
# Loop safety: whichever token pushes the regenerated commit, the pusher
# is never dependabot[bot] (it's either github-actions[bot] via
# GITHUB_TOKEN, or the PAT's owning identity), so the `commit` job's
# `if:` guard on github.actor == 'dependabot[bot]' already prevents the
# resulting synchronize event from re-triggering that job -- true for
# either token path. The read-only `regenerate`/`verify-download` jobs
# have no such guard by design (see above) and are safe to re-run on that
# synchronize event regardless, since they never write anything.
name: Dependabot License Regeneration

on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - .github/workflows/dependabot-licenses.yaml

# Grouped Dependabot updates can push several commits to the same PR in
# quick succession. cancel-in-progress stays false: the PAT-pushed
# synchronize event this workflow's own commit job causes would otherwise
# cancel the very run that just pushed, and since the push has already
# happened by that point there is nothing left to lose by letting a
# superseded run finish -- only a cosmetic "cancelled" status to avoid.
# Non-fast-forward races between overlapping commit-job pushes are already
# handled by `git push` itself failing loudly if that ever happens.
concurrency:
  group: dependabot-licenses-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs Go tooling against the PR head. Read-only: the write token used
  # by the commit job must never coexist with a job that executes code
  # from the PR head. Runs for any same-repo PR matching the path filter
  # above, not just Dependabot's.
  regenerate:
    name: Regenerate THIRD_PARTY_LICENSES.md
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # go.mod-resolution domains are byte-identical to the License
          # Check job's allowlist in ci.yaml: go-licenses resolves each
          # module's documented source against these, and `make license`
          # runs the same go-licenses report/check calls that job does.
          # results-receiver.actions.githubusercontent.com and
          # *.blob.core.windows.net are upload-artifact's own endpoints
          # (GitHub Actions runner communication-requirements docs:
          # "Artifacts, logs, and caches"), needed for the upload step
          # below -- ci.yaml has no artifact step, so it has no equivalent
          # entry to copy.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            golang.org:443
            google.golang.org:443
            gopkg.in:443
            k8s.io:443
            sigs.k8s.io:443
            go.yaml.in:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      # Regenerates THIRD_PARTY_LICENSES.md and fails the job (without
      # committing anything) if go-licenses finds a dependency whose
      # license is outside hack/allowed-licenses.txt -- a real policy
      # violation should still block the PR, not be silently committed.
      - name: Regenerate and validate license inventory
        run: make license

      - name: Upload regenerated inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          retention-days: 1

  # Observability-only: downloads the artifact regenerate produced and
  # shows what it would change, on every same-repo PR the trigger covers.
  # This is what lets the artifact upload/download path (and this
  # workflow's own edits) be verified by a normal PR's CI run instead of
  # staying unverified until a real Dependabot PR happens to exercise it.
  # Never commits or pushes.
  verify-download:
    name: Verify downloaded inventory (dry run)
    needs: regenerate
    if: >
      needs.regenerate.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # Overwrites the checked-out THIRD_PARTY_LICENSES.md in place: the
      # artifact was uploaded from the same repo-root-relative path, so
      # download-artifact's default destination (the workspace root)
      # lands it exactly there.
      - name: Download regenerated inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses

      - name: Show diff against the committed inventory
        run: git --no-pager diff --stat -- THIRD_PARTY_LICENSES.md

  # Holds the write token but never runs Go tooling or any other code
  # from the PR head -- it only places a previously-generated file and
  # commits it. Stays gated to Dependabot's own PRs: this is the only job
  # that writes anything.
  commit:
    name: Commit regenerated inventory
    needs: regenerate
    # A custom if: replaces the implicit success() gate on needs, so it is
    # spelled out here -- otherwise a failed `regenerate` (e.g. a real
    # disallowed-license finding) would still let this job start and fail
    # noisily on a missing artifact instead of being cleanly skipped.
    if: >
      needs.regenerate.result == 'success' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The `secrets` context is not available in step-level `if:` conditions
    # (actionlint/GitHub context-availability rules), so the presence check
    # is computed once here, where `secrets` is allowed, and read back via
    # the `env` context where it is.
    env:
      HAS_LICENSE_PAT: ${{ secrets.DEPENDABOT_LICENSE_TOKEN != '' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # Falls back to the ambient GITHUB_TOKEN when the PAT secret
          # is not configured -- see the header comment for what that
          # trade-off means for the pushed commit's CI.
          token: ${{ secrets.DEPENDABOT_LICENSE_TOKEN || github.token }}

      - name: Download regenerated inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-licenses

      - name: Warn if no PAT is configured
        if: ${{ env.HAS_LICENSE_PAT == 'false' }}
        run: echo "::warning::DEPENDABOT_LICENSE_TOKEN is not set under Settings -> Secrets and variables -> Dependabot; committing with GITHUB_TOKEN instead. That push will NOT trigger a new CI run on this PR -- a maintainer will need to manually re-run/approve checks on the pushed commit."

      - name: Commit regenerated inventory
        env:
          # Indirected through env rather than interpolated straight into
          # the run: script, per this repo's Actions injection guard --
          # head.ref is attacker-influenceable input on other event types,
          # and a Dependabot branch name is not an exception worth carving
          # out of that rule.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES.md
          if git diff --staged --quiet; then
            echo "THIRD_PARTY_LICENSES.md already up to date; nothing to commit."
          else
            # "[dependabot skip]" keeps Dependabot auto-rebasing this
            # branch onto main despite the foreign commit -- see the
            # header comment.
            git commit -m "chore: regenerate THIRD_PARTY_LICENSES.md for dependency update" -m "[dependabot skip]"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          fi
