# Pinning every action to a commit SHA (see the workflows) removes the
# supply-chain risk of a repointable tag, but it also freezes the actions
# permanently unless something proposes updates. That is the trade this
# file exists to close: without it, SHA pinning swaps a compromise risk for
# a staleness risk that nobody notices for a year.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Dockerfile's two FROM lines are pinned to digests, not floating tags
  # (golang:1.26-alpine, alpine:3.21) -- same trade as github-actions above:
  # pinning closes the repointable-tag risk but freezes the base image
  # permanently without something proposing updates.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"

  # The gomod ecosystem was deliberately left disabled here until CI's
  # License Check job (which fails a PR whenever THIRD_PARTY_LICENSES.md
  # is stale relative to go.mod/go.sum) had a way to stay current on its
  # own -- otherwise every weekly Go dependency PR would arrive red on
  # arrival (issue #26). That gap is closed by
  # .github/workflows/dependabot-licenses.yaml: it regenerates
  # THIRD_PARTY_LICENSES.md with the same `make license` tooling CI uses
  # and commits the result back onto the Dependabot branch before a human
  # looks at the PR, so the License Check job no longer arrives red just
  # because the inventory is stale -- only a genuine disallowed license
  # (checked against hack/allowed-licenses.txt) still fails it.
  # Minor/patch bumps are grouped into one PR per week to cut review noise;
  # majors stay individual since a Go major bump can break the API and
  # warrants its own review.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      go-dependencies:
        update-types:
          - "minor"
          - "patch"
