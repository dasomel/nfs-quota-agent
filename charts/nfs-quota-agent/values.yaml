# Default values for nfs-quota-agent
#
# CRDs: this chart installs the QuotaPolicy CRD from crds/ (Helm applies
# everything in that directory once, before any templates, and never on
# `helm upgrade`). That means a schema change to crds/quota.nfs.io_quotapolicies.yaml
# in a later chart version is NOT picked up by `helm upgrade` — Helm also
# never deletes CRDs in crds/ on `helm uninstall`, leaving QuotaPolicy objects
# in the cluster. Apply CRD changes explicitly:
#   kubectl apply -f charts/nfs-quota-agent/crds/
# and remove the CRD (and every QuotaPolicy it defines) explicitly if you
# ever need to: `kubectl delete crd quotapolicies.quota.nfs.io`.

image:
  repository: ghcr.io/dasomel/nfs-quota-agent
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# NFS quota agent configuration
config:
  # Local path where NFS export is mounted in container
  nfsBasePath: /export
  # NFS server's export path
  nfsServerPath: /data
  # Provisioner name to filter PVs
  # Options:
  #   - nfs.csi.k8s.io (csi-driver-nfs, recommended)
  #   - cluster.local/nfs-subdir-external-provisioner (legacy)
  provisionerName: nfs.csi.k8s.io
  # Process all NFS PVs regardless of provisioner
  processAllNFS: false
  # Interval between quota syncs
  syncInterval: 30s
  # Metrics server address (set to empty string to disable)
  metricsAddr: ":9090"

# Web UI configuration
webUI:
  enabled: false
  addr: ":8080"

# Audit logging configuration
audit:
  enabled: false
  # Path to audit log file inside container
  logPath: /var/log/nfs-quota-agent/audit.log
  # Host path for persistent audit logs (mounted as hostPath volume)
  hostPath: /var/log/nfs-quota-agent

# Auto-cleanup configuration for orphaned directories
cleanup:
  enabled: false
  # Interval between cleanup runs (e.g., 1h, 30m)
  interval: 1h
  # Grace period before deleting orphaned directories
  gracePeriod: 24h
  # Dry-run mode: log what would be deleted but don't actually delete
  dryRun: true

# Agent state directory: usage history (when enabled) and the crash-safe
# backup sidecars the agent keeps for /etc/projects and /etc/projid before
# rewriting them in place (see internal/quota/project.go RemoveLineFromFile
# and RecoverProjectFile). Always mounted, independent of history.enabled,
# because the sidecar mechanism needs it regardless of whether history
# collection is on. hostPath and path previously lived under `history:` as
# `history.hostPath`/part of `history.path`; they moved here because a
# volume gated on history.enabled would leave the sidecar with nowhere
# durable to land the rest of the time. Do not add a second volume mounting
# `state.path` — see the mount-collision note this replaced.
state:
  # Host path backing the state volume (mounted unconditionally).
  hostPath: /var/lib/nfs-quota-agent
  # Path inside the container where the state volume is mounted, and the
  # value passed to --state-dir. Keep this equal to hostPath's mountPath
  # unless you know why you're changing it.
  path: /var/lib/nfs-quota-agent

# NFS server active/standby HA gate -- see docs/ha-dr.md. This agent does
# not implement election, fencing, or replication itself: it only refuses
# quota mutation when the given file is absent. An external HA tool
# (Pacemaker resource agent, a DRBD promote/demote hook, a custom script)
# creates/removes the file to declare this node active/standby.
ha:
  # Empty (default) disables HA gating entirely -- this instance always
  # enforces, unchanged from every release before this flag existed. Set
  # to a path under state.path (already a host-backed volume, no extra
  # mount needed) to enable, e.g. "/var/lib/nfs-quota-agent/ha-active".
  activeFile: ""

# Usage history and trend tracking
history:
  enabled: false
  # Path to store history data inside container (under state.path).
  path: /var/lib/nfs-quota-agent/history.json
  # Interval between history snapshots
  interval: 5m
  # How long to keep history data
  retention: 720h  # 30 days

# Namespace quota policy: the web UI's advisory Policies/Violations views
# (LimitRange and nfs.io/*-quota annotations, surfaced for humans). Does not
# affect actual quota sizing -- see internal/policy's package doc and
# docs/feature-guide.md. defaultQuota/enforceMaxQuota keys previously lived
# here but fed CLI flags with no reader anywhere in the codebase and were
# removed rather than left as settings that silently did nothing.
policy:
  enabled: false

# QuotaPolicy (quota.nfs.io/v1alpha1) custom resource-based quota
# enforcement — see docs/quotapolicy-design.md. Distinct from `policy:`
# above, which is the older LimitRange/Annotation/Global namespace-wide
# chain; QuotaPolicy sits above that chain and adds per-PVC-name and
# per-label-selector policies. Off by default for two reasons: it is a new
# reconcile path added well after this chart's other enforcement
# mechanisms, so existing deployments must opt in rather than pick up new
# enforcement behavior on a chart bump; and the chart installs the CRD from
# crds/ once, but never updates it on `helm upgrade` (see the note at the
# top of this file) or removes it on `helm uninstall`, so turning this on
# is a step an operator should take deliberately, not one bundled silently
# into an unrelated values change.
quotaPolicy:
  enabled: false
  # Gates QuotaPolicy *status* write-back only -- enforcement is unaffected.
  # This chart is a DaemonSet that explicitly supports several NFS server
  # nodes at once (see nodeSelector's comment below): every one of them
  # would otherwise overwrite the same QuotaPolicy's status with its own
  # partial appliedClaims/failingClaims view every sync cycle, making the
  # object's status flap rather than converge. Set this to true only when
  # you have verified exactly one node runs with quotaPolicy.enabled: true
  # (e.g. a single NFS server node, or a separate release with its own
  # nodeSelector for the rest). See docs/quotapolicy-design.md §11.
  singleWriter: false

# Metrics service configuration
service:
  enabled: true
  type: ClusterIP
  port: 9090
  # Web UI port (only used when webUI.enabled is true)
  uiPort: 8080
  annotations: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "9090"

# NFS export volume configuration
nfsExport:
  # Host path to NFS export directory on the server
  hostPath: /data

serviceAccount:
  create: true
  annotations: {}
  name: ""

# Node selector to run on NFS server node.
# Label your NFS server node: kubectl label node <node> nfs-server=true
#
# This is a DaemonSet: it schedules a pod on every node this selector
# matches. Leaving it empty would place a privileged, hostPath-backed pod
# on every node in the cluster, so the chart rejects an empty nodeSelector
# at render time instead of silently widening scheduling. To manage
# several NFS servers, add each node's label here (or run a separate
# release per node if their configs differ).
nodeSelector:
  nfs-server: "true"

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}

# Liveness/readiness/startup probes, served by the metrics port's /health
# and /ready endpoints. /ready also backs the startup probe: liveness and
# readiness are disabled by Kubernetes until it succeeds, so the startup
# probe's own budget (failureThreshold * periodSeconds) is the real grace
# period for slow NFS mounts and the agent's initial quota sync.
probes:
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30 # ~5m room for a slow NFS mount + initial sync
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Share the host PID namespace. Off by default: the agent never inspects
# host processes (it resolves paths inside the container's own mount
# namespace via findmnt/df against the hostPath-mounted export), so this
# grants visibility of every host process — combined with `privileged: true`
# below, for zero functional benefit. Set to true only if a specific
# deployment genuinely needs it.
hostPID: false

# DaemonSet rollout strategy. RollingUpdate updates one node at a time
# (bounded by maxUnavailable): the kubelet terminates the old pod on a
# node and waits for the new one to become Ready before the controller
# moves to the next node, so old and new pods never run concurrently on
# the same node — the single-writer assumption behind /etc/projects and
# /etc/projid holds during upgrades too. OnDelete was considered (fully
# manual, one node at a time, operator-triggered) but rejected as the
# default: this agent runs privileged with no leader election, so leaving
# upgrades — including security patches — to be triggered by hand risks
# nodes drifting to stale, unpatched versions indefinitely. maxUnavailable
# above 1 is still available for operators who want faster rollouts across
# many NFS server nodes and accept more nodes losing quota enforcement at
# once.
#
# maxSurge is deliberately unset and rejected at render time. A surging
# DaemonSet starts the replacement pod on a node before the old one exits,
# which puts two agents on the same host writing the same files — the exact
# race the single-writer design rules out. Tune rollout speed with
# maxUnavailable instead.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Security context for the container
# Privileged is required for xfs_quota/setquota commands
securityContext:
  privileged: true

podSecurityContext: {}

podAnnotations: {}

podLabels: {}

# Prometheus metrics configurations
metrics:
  serviceMonitor:
    enabled: false
    # interval: 30s
    # scrapeTimeout: 10s
    # labels:
    #   release: prometheus
  prometheusRule:
    enabled: false
    # labels:
    #   role: alert-rules

# Pod disruption budget configuration.
#
# `kubectl drain` skips DaemonSet-owned pods entirely unless
# --ignore-daemonsets is passed, and even then it does not evict them —
# it just proceeds without waiting, so this PDB never blocks routine node
# drains. What it does guard against is a bulk voluntary-eviction caller
# that targets DaemonSet pods directly (cluster-autoscaler, a descheduler,
# multi-node maintenance tooling): with pods spread one-per-node,
# maxUnavailable: 1 caps such a caller to evicting the agent on one NFS
# server node at a time, so a fleet-wide maintenance action can't take
# every node's quota enforcement down simultaneously. minAvailable is
# deliberately not used: with exactly one pod per matching node, there is
# no "available replica" pool to protect the way a Deployment has — each
# node's pod only protects that node.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

