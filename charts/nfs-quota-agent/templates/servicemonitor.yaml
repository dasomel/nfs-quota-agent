{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nfs-quota-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nfs-quota-agent.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "nfs-quota-agent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      {{- if .Values.metrics.serviceMonitor.interval }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- end }}
      {{- if .Values.metrics.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      {{- end }}
      path: /metrics
      relabelings:
        # nfs_quota_agent_info carries no node label (see internal/metrics/metrics.go);
        # promote the pod's node name so the "Agent Status per Node" dashboard panel
        # can group by node.
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
{{- end }}
