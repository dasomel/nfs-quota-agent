{{- if not .Values.nodeSelector }}
{{- fail "nodeSelector must not be empty. nfs-quota-agent is a privileged, hostPath-backed DaemonSet: an empty nodeSelector schedules it onto every node in the cluster, not just NFS server nodes. Label your NFS server node(s) (kubectl label node <node> nfs-server=true) and keep the matching nodeSelector set — do not clear it to widen scheduling. See docs/security.md." }}
{{- end }}
{{- if and .Values.updateStrategy .Values.updateStrategy.rollingUpdate .Values.updateStrategy.rollingUpdate.maxSurge }}
{{- fail "updateStrategy.rollingUpdate.maxSurge must not be set. A surging DaemonSet starts the replacement pod on a node before the old one exits, so two agents briefly write /etc/projects and /etc/projid on that node at once — the dual-writer race this chart otherwise prevents, since the agent has no leader election or file locking. Leave maxSurge unset (0) so each node terminates before it is replaced; use maxUnavailable to control rollout speed across nodes." }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nfs-quota-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nfs-quota-agent.labels" . | nindent 4 }}
spec:
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nfs-quota-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nfs-quota-agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nfs-quota-agent.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.hostPID }}
      hostPID: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "nfs-quota-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --nfs-base-path={{ .Values.config.nfsBasePath }}
            - --nfs-server-path={{ .Values.config.nfsServerPath }}
            - --provisioner-name={{ .Values.config.provisionerName }}
            - --sync-interval={{ .Values.config.syncInterval }}
            - --state-dir={{ .Values.state.path }}
            {{- if .Values.ha.activeFile }}
            - --ha-active-file={{ .Values.ha.activeFile }}
            {{- end }}
            {{- if .Values.config.metricsAddr }}
            - --metrics-addr={{ .Values.config.metricsAddr }}
            {{- end }}
            {{- if .Values.config.processAllNFS }}
            - --process-all-nfs
            {{- end }}
            {{- if .Values.webUI.enabled }}
            - --enable-ui
            - --ui-addr={{ .Values.webUI.addr }}
            {{- end }}
            {{- if .Values.audit.enabled }}
            - --enable-audit
            - --audit-log-path={{ .Values.audit.logPath }}
            {{- end }}
            {{- if .Values.cleanup.enabled }}
            - --enable-auto-cleanup
            - --cleanup-interval={{ .Values.cleanup.interval }}
            - --orphan-grace-period={{ .Values.cleanup.gracePeriod }}
            {{- if .Values.cleanup.dryRun }}
            - --cleanup-dry-run=true
            {{- else }}
            - --cleanup-dry-run=false
            {{- end }}
            {{- end }}
            {{- if .Values.history.enabled }}
            - --enable-history
            - --history-path={{ .Values.history.path }}
            - --history-interval={{ .Values.history.interval }}
            - --history-retention={{ .Values.history.retention }}
            {{- end }}
            {{- if .Values.policy.enabled }}
            - --enable-policy
            {{- end }}
            {{- if .Values.quotaPolicy.enabled }}
            - --enable-quota-policy
            {{- if .Values.quotaPolicy.singleWriter }}
            - --quota-policy-single-writer
            {{- end }}
            {{- end }}
            {{- if .Values.events.enabled }}
            - --enable-events
            {{- end }}
          ports:
            {{- if .Values.config.metricsAddr }}
            - name: metrics
              containerPort: {{ (split ":" .Values.config.metricsAddr)._1 | default 9090 }}
              protocol: TCP
            {{- end }}
            {{- if .Values.webUI.enabled }}
            - name: http
              containerPort: {{ (split ":" .Values.webUI.addr)._1 | default 8080 }}
              protocol: TCP
            {{- end }}
          {{- if .Values.config.metricsAddr }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: nfs-export
              mountPath: {{ .Values.config.nfsBasePath }}
            - name: dev
              mountPath: /dev
            - name: etc-projects
              mountPath: /etc/projects
            - name: etc-projid
              mountPath: /etc/projid
            - name: state
              mountPath: {{ .Values.state.path }}
            {{- if .Values.audit.enabled }}
            - name: audit-log
              mountPath: /var/log/nfs-quota-agent
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nfs-export
          hostPath:
            path: {{ .Values.nfsExport.hostPath }}
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: etc-projects
          hostPath:
            path: /etc/projects
            type: FileOrCreate
        - name: etc-projid
          hostPath:
            path: /etc/projid
            type: FileOrCreate
        - name: state
          hostPath:
            path: {{ .Values.state.hostPath }}
            type: DirectoryOrCreate
        {{- if .Values.audit.enabled }}
        - name: audit-log
          hostPath:
            path: {{ .Values.audit.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
