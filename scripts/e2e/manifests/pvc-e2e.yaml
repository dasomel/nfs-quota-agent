apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-e2e
  annotations:
    pv.kubernetes.io/provisioned-by: nfs.csi.k8s.io
spec:
  capacity:
    storage: 100M
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - vers=4
  storageClassName: manual
  nfs:
    server: __GATEWAY_IP__
    path: /srv/nfs-export/pvc-e2e
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-e2e
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  resources:
    requests:
      storage: 100M
  volumeName: pv-e2e
