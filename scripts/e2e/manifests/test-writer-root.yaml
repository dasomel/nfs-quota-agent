# A deliberately privileged (root) writer, used ONLY by Stage D's
# supplementary bypass-documentation step -- see run-airgap-e2e.sh's
# assert_root_writer_outcome. Its purpose is the opposite of
# test-writer.yaml's: prove, on purpose, that a root writer over an NFS
# export with no_root_squash can exceed an ext4 project quota's hard limit
# (fs/quota/dquot.c ignore_hardlimit() waives it for CAP_SYS_RESOURCE), and
# that xfs/btrfs enforce their hard limit regardless of privilege. Do not
# use this manifest for the primary enforcement assertion; test-writer.yaml
# (non-root) is the realistic-tenant case.
apiVersion: v1
kind: Pod
metadata:
  name: test-writer-root
  namespace: default
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
  containers:
  - name: writer
    image: busybox:1.36
    imagePullPolicy: Never
    command: ["sleep", "3600"]
    volumeMounts:
    - name: nfs-vol
      mountPath: /mnt/nfs
  volumes:
  - name: nfs-vol
    persistentVolumeClaim:
      claimName: pvc-e2e
