apiVersion: v1
kind: Pod
metadata:
  name: test-writer
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: writer
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sleep", "3600"]
    volumeMounts:
    - name: nfs-vol
      mountPath: /mnt/nfs
  volumes:
  - name: nfs-vol
    persistentVolumeClaim:
      claimName: pvc-e2e
