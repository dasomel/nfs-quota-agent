apiVersion: v1
kind: Pod
metadata:
  name: test-writer
  namespace: default
spec:
  restartPolicy: Never
  containers:
  - name: writer
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sleep", "3600"]
    volumeMounts:
    - name: nfs-vol
      mountPath: /mnt/nfs
  volumes:
  - name: nfs-vol
    # D1: Use hostPath into kind node's /srv/nfs-export/pvc-e2e (mounted from host XFS via extraMounts).
    # This proves host-side project quota; the NFS wire path is deliberately not covered.
    hostPath:
      path: /srv/nfs-export/pvc-e2e
      type: Directory
