# Runs as a non-root, non-privileged identity (uid/gid 65534, "nobody") so
# the Stage D enforcement proof exercises the realistic tenant case, not a
# privileged one. This matters specifically for ext4: fs/quota/dquot.c's
# ignore_hardlimit() lets a writer holding CAP_SYS_RESOURCE (root) exceed a
# project quota's hard limit outright, and knfsd performs the write with
# credentials mapped from the incoming NFS client -- a root-owned pod over
# an export with no_root_squash writes as root on the server and silently
# bypasses the ext4 hard limit (see CLAUDE.md's ext4 CAP_SYS_RESOURCE
# gotcha). uid 65534 carries no such capability, so knfsd's mapped
# credentials for this pod are ordinary and the hard limit applies on all
# three backends (xfs, ext4, btrfs). fsGroup is not needed: the export
# directory is created world-writable (0777) by the E2E setup scripts.
apiVersion: v1
kind: Pod
metadata:
  name: test-writer
  namespace: default
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
  containers:
  - name: writer
    image: busybox:1.36
    imagePullPolicy: Never
    command: ["sleep", "3600"]
    volumeMounts:
    - name: nfs-vol
      mountPath: /mnt/nfs
  volumes:
  - name: nfs-vol
    persistentVolumeClaim:
      claimName: pvc-e2e
